<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<body>
    <h1>Hi Teacher</h1>
    <h3>STUDENT DETAILS</h3>

    <table border="1">
        <tr>
            <th>Student Name</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for s in student %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.course }}</td>
            <td>{{ s.age }}</td>
            <td>
                <a href="{% url 'edit_student' s.id %}">Edit</a>
                |
                <form action="{% url 'delete_student' s.id %}" method="POST" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No students found.</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{% url 'login' %}">Add Student</a>

</body>
</html>
